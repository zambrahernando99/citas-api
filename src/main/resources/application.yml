spring:
  application:
    name: citas-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  automation:
    api-key: ${AUTOMATION_API_KEY:}
    default-window-hours: ${REMINDER_DEFAULT_WINDOW_HOURS:24}
    max-attempts: ${REMINDER_MAX_ATTEMPTS:3}
    zone: ${AUTOMATION_ZONE:America/Bogota}
    status-webhook-url: ${N8N_STATUS_WEBHOOK_URL:}
    status-webhook-secret: ${N8N_STATUS_WEBHOOK_SECRET:}
    event-max-attempts: ${N8N_EVENT_MAX_ATTEMPTS:5}
    dispatch-enabled: ${N8N_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${N8N_DISPATCH_INTERVAL_MS:30000}
  password-reset:
    ttl-seconds: ${PASSWORD_RESET_TTL_SECONDS:900}
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}
